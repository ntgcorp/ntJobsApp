; test_acJobsApp.ini - file di prova CONDIVISO dai test di esempio
; (test_acJobsApp.py, test_acJobsApp.java, test_acJobsApp.bas).
; I test lo USANO cosi' com'e': non crearne copie e non cancellarlo.
; JOB1 usa COMMAND=SHELL con il comando in PARAM.CMD.
; JOB2 mostra l'alternativa: il valore di COMMAND eseguito direttamente come shell.
; Nota: "& exit 0" forza exit code 0 anche su PC con AutoRun di cmd rotto
; (es. hook conda orfano che stampa "Impossibile trovare il percorso specificato").
[CONFIG]
TYPE=NTJOBS.APP.1.0
NAME=TEST_ACJOBSAPP
EXIT=TRUE
LOG=test_acJobsApp

[JOB1]
COMMAND=SHELL
PARAM.CMD=cmd.exe /c dir *.* /b & exit 0

[JOB2]
COMMAND=cmd.exe /c echo HelloNtJobs & exit 0
